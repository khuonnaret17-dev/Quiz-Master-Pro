
<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>កម្រងសំណួរពហុចម្លើយ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --maroon: #800000;
            --gold: #d4af37;
            --cream: #fffdf5;
        }

        body {
            font-family: 'Kantumruy Pro', sans-serif;
            margin: 0;
            padding: 0;
            background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('https://images.unsplash.com/photo-1507842217343-583bb7270b66?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            min-height: 100vh;
            color: #1a1a1a;
        }
        
        .heading-kh {
            font-family: 'Khmer OS Niroth', 'Kantumruy Pro', sans-serif;
            font-weight: 700;
        }

        .header-glow-maroon {
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px rgba(255, 255, 255, 0.4);
        }

        .text-maroon { color: var(--maroon) !important; }
        .bg-maroon { background-color: var(--maroon) !important; }
        .border-maroon { border-color: var(--maroon) !important; }

        .small-kh {
            font-family: 'Kantumruy Pro', sans-serif;
            font-weight: 400;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .khmer-decorative-frame {
            position: relative;
            padding: 3rem 2rem;
            margin-bottom: 3.5rem;
            background: var(--cream);
            border: 3px double var(--maroon);
            box-shadow: inset 0 0 0 2px var(--gold), 0 15px 35px rgba(0,0,0,0.2);
            border-radius: 8px;
        }

        .khmer-corner {
            position: absolute;
            width: 50px;
            height: 50px;
            border: 5px solid var(--maroon);
            z-index: 10;
        }

        .corner-tl { top: -12px; left: -12px; border-right: none; border-bottom: none; }
        .corner-tr { top: -12px; right: -12px; border-left: none; border-bottom: none; }
        .corner-bl { bottom: -12px; left: -12px; border-right: none; border-top: none; }
        .corner-br { bottom: -12px; right: -12px; border-left: none; border-top: none; }

        .animate-fadeIn {
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ចលនាដកដង្ហើមសម្រាប់ប៊ូតុងទំនាក់ទំនង */
        @keyframes breathing {
            0%, 100% { transform: scale(1); box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
            50% { transform: scale(1.05); box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.4); }
        }

        .animate-breathing {
            animation: breathing 2s ease-in-out infinite;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: var(--maroon);
            border-radius: 10px;
            opacity: 0.3;
        }

        button { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        button:active { transform: scale(0.96); }
    </style>
<script type="importmap">
{
  "imports": {

  }
}
